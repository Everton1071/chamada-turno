name: Gerar APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar o APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon

      - name: Preparar arquivo
        run: cp android/app/build/outputs/apk/release/app-release.apk ChamadaTurno.apk

      - name: Publicar para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-android
          name: Chamada do Turno — app Android
          make_latest: true
          files: ChamadaTurno.apk
          body: |
            Arquivo de instalação do app Chamada do Turno (Laticínios Jussara).
            No celular Android, baixe o **ChamadaTurno.apk** abaixo e toque nele para instalar.
            Versão gerada automaticamente: 1.0.${{ github.run_number }}
