plugins { id 'com.android.application' }

android {
    namespace 'br.com.jussara.chamadaturno'
    compileSdk 34
    defaultConfig {
        applicationId 'br.com.jussara.chamadaturno'
        minSdk 24
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName "1.0." + (System.getenv('VERSION_CODE') ?: '1')
    }
    signingConfigs {
        release {
            // A chave vem dos Secrets do GitHub (ver .github/workflows/apk.yml), nunca do código.
            storeFile System.getenv('KEYSTORE_FILE') ? file(System.getenv('KEYSTORE_FILE')) : null
            storePassword System.getenv('KEYSTORE_PASSWORD')
            keyAlias 'chamadaturno'
            keyPassword System.getenv('KEYSTORE_PASSWORD')
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
